# Production stack — single image built/pushed by GitHub Actions to GHCR.
#   docker login ghcr.io        # once, with a GitHub PAT (read:packages)
#   docker compose -f docker-compose.prod.yml up -d
services:
  app:
    image: ghcr.io/michalg-/hajsomat:latest
    environment:
      - DATABASE_URL=sqlite:///data/portfolio.sqlite3
      - RAGE_ENV=production
    volumes:
      - app_data:/data
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  app_data:
