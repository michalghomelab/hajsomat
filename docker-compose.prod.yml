# Production stack — pulls images built/pushed by GitHub Actions to GHCR.
# Set IMAGE_PREFIX, e.g. IMAGE_PREFIX=ghcr.io/your-user, then: docker compose -f docker-compose.prod.yml up -d
services:
  api:
    image: ${IMAGE_PREFIX:?set IMAGE_PREFIX e.g. ghcr.io/your-user}/hajsomat-api:latest
    environment:
      - DATABASE_URL=sqlite:///data/portfolio.sqlite3
      - RAGE_ENV=production
    volumes:
      - api_data:/data
    restart: unless-stopped

  web:
    image: ${IMAGE_PREFIX:?set IMAGE_PREFIX}/hajsomat-web:latest
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  api_data:
