# Production stack — single image built/pushed by GitHub Actions.
# Set IMAGE (e.g. IMAGE=your-dockerhub-user/hajsomat), then:
#   docker compose -f docker-compose.prod.yml up -d
services:
  app:
    image: ${IMAGE:?set IMAGE e.g. your-dockerhub-user/hajsomat}:latest
    environment:
      - DATABASE_URL=sqlite:///data/portfolio.sqlite3
      - RAGE_ENV=production
    volumes:
      - app_data:/data
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  app_data:
