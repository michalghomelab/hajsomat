server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API requests are reverse-proxied to the Rage service.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  # SPA: serve index.html for client-side (hash) routing.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
