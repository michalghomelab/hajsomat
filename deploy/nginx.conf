server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Internal endpoint is for the in-container scheduler only — not the public.
  location /api/internal/ {
    return 403;
  }

  # API → Rage running in the same container.
  location /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  # WebSocket (Rage::Cable) → Rage, with the upgrade handshake.
  location /cable {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  # SPA: serve index.html for client-side (hash) routing.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
