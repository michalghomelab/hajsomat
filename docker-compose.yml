services:
  api:
    build: ./api
    environment:
      - TWELVE_DATA_API_KEY=${TWELVE_DATA_API_KEY:-dummy}
      - DATABASE_URL=sqlite:///data/portfolio.sqlite3
      - RACK_ENV=development
    volumes:
      - ./api:/app
      - api_data:/data
    ports:
      - "3000:3000"
    develop:
      watch:
        - action: sync
          path: ./api
          target: /app
          ignore:
            - log/
            - tmp/
            - db/
        - action: rebuild
          path: ./api/Gemfile
  scheduler:
    build: ./api
    command: bundle exec ruby bin/scheduler
    environment:
      - DATABASE_URL=sqlite:///data/portfolio.sqlite3
      - RACK_ENV=development
      - INTERNAL_BASE_URL=http://api:3000
    volumes:
      - ./api:/app
      - api_data:/data
    depends_on:
      - api

  web:
    build: ./web
    volumes:
      - ./web:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api
    develop:
      watch:
        - action: sync
          path: ./web/src
          target: /app/src
        - action: rebuild
          path: ./web/package.json

volumes:
  api_data:
